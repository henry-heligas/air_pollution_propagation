[project]
name = "air-pollution-propagation"
version = "0.1.0"
description = "Multi-scale physics-informed air quality modeling pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core API & Orchestration
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "celery[redis]>=5.3.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # Database & Spatial Data I/O
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.28",
    "geoalchemy2>=0.14.4",
    "geopandas>=0.14.3",
    "rasterio>=1.3.9",
    "xarray>=2024.2.0",
    "netcdf4>=1.6.5",
    # Tier 1 Math & Physics
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "pandas>=2.2.1",
    # Visualization Diagnostics
    "altair>=5.2.0",
    "psycopg2-binary>=2.9.13",
    "shapely>=2.1.2",
    "redis>=6.4.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "folium>=0.20.0",
    "mapclassify>=2.10.0",
    "libpysal>=4.14.1",
    "esda>=2.9.0",
    "plotly>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
